[project]
name = "spike-edge"
version = "0.1.0"
description = "Spike detection and data reduction under implant-like compute and bandwidth limits"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "numba>=0.59", "matplotlib>=3.8"]

[project.optional-dependencies]
train = ["torch>=2.2"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["spike_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
